<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>vela · גלקסיית הנושאים</title>
    <link rel="icon" href="/favicon-teacher.png" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/galaxy.css?v=38" />
  </head>
  <body>
    <!-- ספרייט: סימנים קטנים וגרדיאנטים משותפים. אמנות סופית יכולה להחליף כל
         symbol כאן, או להיכנס כ-<img> דרך GALAXY_ART (galaxy-data.js). -->
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff2ba" /><stop offset="0.55" stop-color="#ffc947" /><stop offset="1" stop-color="#f59e0b" />
        </linearGradient>
        <!-- החצי הרחוק של המסלול (למעלה) חיוור, הקרוב (למטה) בהיר — עומק בלי מסכות -->
        <linearGradient id="g-orbit" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fd4ff" stop-opacity="0.03" /><stop offset="0.38" stop-color="#bfe4ff" stop-opacity="0.1" />
          <stop offset="0.72" stop-color="#d8f2ff" stop-opacity="0.2" /><stop offset="1" stop-color="#eaf8ff" stop-opacity="0.3" />
        </linearGradient>
        <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9af7e8" /><stop offset="1" stop-color="#22c3b0" />
        </linearGradient>
        <symbol id="g-star" viewBox="0 0 24 24">
          <path d="M12 2.6l2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 16.63l-5.5 2.89 1.05-6.12L3.1 9.07l6.15-.9z"
                fill="url(#g-gold)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
        </symbol>
        <symbol id="g-spark" viewBox="0 0 24 24">
          <path d="M12 1c.9 6.6 3.4 9.1 11 11-7.6 1.9-10.1 4.4-11 11-.9-6.6-3.4-9.1-11-11 7.6-1.9 10.1-4.4 11-11z" fill="currentColor" />
        </symbol>
        <symbol id="g-back" viewBox="0 0 24 24">
          <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <div id="boot" class="boot"><span class="spin"></span></div>

    <main id="sky" class="sky" hidden>
      <!-- שכבות רקע — כל אחת זזה בקצב אחר (parallax) -->
      <!-- הרחוקה מכולן: פס-גלקסיה אלכסוני ואבק-חלל. כמעט לא זזה, ולכן היא
           נקראת כ"עומק" ולא כתמונה שמרחפת מעל -->
      <div class="layer layer--deep" data-depth="0.006" aria-hidden="true">
        <span class="band"></span>
        <span class="dust dust--1"></span><span class="dust dust--2"></span>
      </div>
      <div class="layer layer--neb" data-depth="0.045" aria-hidden="true">
        <span class="neb neb--1"></span><span class="neb neb--2"></span><span class="neb neb--3"></span><span class="neb neb--4"></span>
      </div>
      <div class="layer layer--far" data-depth="0.012" id="starsFar" aria-hidden="true"></div>
      <div class="layer layer--mid" data-depth="0.026" id="starsMid" aria-hidden="true"></div>
      <div class="layer layer--sparks" data-depth="0.034" aria-hidden="true">
        <span class="spark" style="top:17%;left:13%;animation-delay:-1s"><svg viewBox="0 0 24 24"><use href="#g-spark" /></svg></span>
        <span class="spark" style="top:13%;left:79%;animation-delay:-3.2s"><svg viewBox="0 0 24 24"><use href="#g-spark" /></svg></span>
        <span class="spark" style="top:57%;left:91%;animation-delay:-2s;transform:scale(.75)"><svg viewBox="0 0 24 24"><use href="#g-spark" /></svg></span>
        <span class="spark" style="top:75%;left:9%;animation-delay:-4.4s"><svg viewBox="0 0 24 24"><use href="#g-spark" /></svg></span>
        <span class="spark" style="top:88%;left:63%;animation-delay:-0.6s;transform:scale(.8)"><svg viewBox="0 0 24 24"><use href="#g-spark" /></svg></span>
        <span class="spark" style="top:10%;left:41%;animation-delay:-2.7s;transform:scale(.65)"><svg viewBox="0 0 24 24"><use href="#g-spark" /></svg></span>
      </div>

      <!-- כדור-הארץ: שכבת-נוף בלבד בפינה השמאלית-התחתונה. יושב אחרי שכבות
           הרקע ולפני .world, ולכן הוא מאחורי הכוכבים, החללית וה-UI. אין לו
           שום תפקיד במשחק — pointer-events כבוי, aria-hidden. -->
      <div class="layer layer--earth" data-depth="0.018" aria-hidden="true">
        <img class="earth" src="/images/galaxy/earth.webp" alt="" />
      </div>

      <!-- טבעות-המסלול (נבנות ב-JS לפי גודל המסך) -->
      <!-- העולם: מסלולים, שמש, כוכבים וחללית. נע כיחידה אחת (--world-y) כדי
           שההרכב כולו יתמרכז במסך; כל החישובים נשארים ביחס למרכז העולם. -->
      <div class="world" id="world">
        <div class="rings" id="rings" data-depth="0.05" aria-hidden="true"></div>

        <!-- השמש = הכיתה -->
        <div class="sun" id="sun" data-depth="0.02">
          <span class="sun__glow"></span>
          <span class="sun__flare"></span>
          <span class="sun__corona"></span>
          <span class="sun__core"></span>
          <span class="sun__label" id="sunLabel">כיתה א׳</span>
        </div>

        <!-- כוכבי הלכת נבנים ב-galaxy.js -->
        <div class="planets" id="planets" data-depth="0.06"></div>

        <!-- החללית: המיכל זז, השכבות שבתוכו ניתנות להחלפה באמנות סופית -->
        <div class="ship" id="ship" aria-hidden="true">
          <span class="ship__aura"></span>
          <span class="ship__glow"></span>
          <span class="ship__flame">
            <svg viewBox="0 0 24 40">
              <defs>
                <linearGradient id="sh-fire" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#fff3c4" /><stop offset="0.45" stop-color="#ffb347" /><stop offset="1" stop-color="#ff6a3d" stop-opacity="0" />
                </linearGradient>
              </defs>
              <g class="ship__fire">
                <path d="M12 0C19.5 5 21.5 16 12 40 2.5 16 4.5 5 12 0z" fill="url(#sh-fire)" />
                <path d="M12 1.5c3.8 4.5 4.4 11 0 22.5-4.4-11.5-3.8-18 0-22.5z" fill="#fffbe8" opacity="0.85" />
              </g>
            </svg>
          </span>
          <span class="ship__body">
            <svg viewBox="0 0 64 96">
              <defs>
                <linearGradient id="sh-hull" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#ffffff" /><stop offset="0.6" stop-color="#eef6fb" /><stop offset="1" stop-color="#c9ddea" />
                </linearGradient>
                <linearGradient id="sh-nose" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff9e8c" /><stop offset="1" stop-color="#f0587a" />
                </linearGradient>
                <linearGradient id="sh-fin" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#4fe0cd" /><stop offset="1" stop-color="#159c90" />
                </linearGradient>
                <radialGradient id="sh-glass" cx="0.38" cy="0.35" r="0.75">
                  <stop offset="0" stop-color="#c8f8ff" /><stop offset="1" stop-color="#34bcd3" />
                </radialGradient>
              </defs>
              <path d="M18.5 56C10 60 6.5 70 7.5 82c3.5-3.5 7.5-5.5 12.5-6z" fill="url(#sh-fin)" stroke="rgba(8,40,60,.28)" stroke-width="1.1" stroke-linejoin="round" />
              <path d="M45.5 56C54 60 57.5 70 56.5 82c-3.5-3.5-7.5-5.5-12.5-6z" fill="url(#sh-fin)" stroke="rgba(8,40,60,.28)" stroke-width="1.1" stroke-linejoin="round" />
              <path d="M32 5c12 10 16.5 31 15.5 55-.3 8-3 14-7.5 16H24c-4.5-2-7.2-8-7.5-16C15.5 36 20 15 32 5z" fill="url(#sh-hull)" stroke="rgba(8,40,60,.28)" stroke-width="1.2" stroke-linejoin="round" />
              <path d="M38 12c7 10 10 28 9.5 48-.3 8-3 14-7.5 16h-4c4-10 5.5-32 2-64z" fill="rgba(40,90,130,.12)" />
              <path d="M32 5c7.5 6 11 13.5 12.6 22-8.4 2.4-16.8 2.4-25.2 0C21 18.5 24.5 11 32 5z" fill="url(#sh-nose)" />
              <path d="M17.2 63h29.6l-.5 5.5H17.7z" fill="#3fd6c4" />
              <circle cx="32" cy="45" r="8.6" fill="#13405a" />
              <circle cx="32" cy="45" r="6.4" fill="url(#sh-glass)" />
              <ellipse cx="29.6" cy="42.6" rx="2.4" ry="1.8" fill="#fff" opacity="0.85" />
              <path d="M24.5 76h15l-2.1 6.5H26.6z" fill="#29496b" />
            </svg>
          </span>
        </div>

        <!-- כותרת עליונה -->
      </div>

      <!-- קדמת-הבמה: גופים קטנים מחוץ למוקד, בשוליים בלבד. הם רק מוסיפים עומק —
           pointer-events כבוי, ואין להם שום תפקיד במשחק -->
      <div class="layer layer--fore" data-depth="0.08" aria-hidden="true">
        <span class="mote mote--1"></span><span class="mote mote--2"></span><span class="mote mote--3"></span>
        <span class="rock rock--1"></span><span class="rock rock--2"></span><span class="rock rock--3"></span>
      </div>

      <header class="hud">
        <a class="hud__back" href="/learn" aria-label="חזרה"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#g-back" /></svg></a>
        <div class="hud__mid">
          <div class="hud__t" id="hudTitle">הגלקסיה שלי</div>
          <div class="hud__s" id="hudSub"></div>
        </div>
        <div class="hud__stat" id="hudStat"></div>
      </header>

      <p class="hint" id="hint"><span>בחר/י כוכב — כל כוכב הוא נושא</span></p>
    </main>

    <!-- כניסה לעולם (galaxy.js): הצבע של הכוכב, הכוכב המתקרב, וכיסוי-הניווט -->
    <div class="warp-fill" id="warpFill" hidden aria-hidden="true"></div>
    <div class="warp-hero" id="warpHero" hidden aria-hidden="true"></div>
    <div class="warp-cover" id="warpCover" hidden aria-hidden="true"></div>

    <script src="/galaxy-data.js?v=16"></script>
    <script src="/galaxy.js?v=32"></script>
  </body>
</html>
