services:
  - type: web
    name: vela
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # מפתחות מוזנים בלוח הבקרה של Render (לא נשמרים בקוד) — sync:false מבקש אותם שם
      - key: ANTHROPIC_API_KEY
        sync: false
      # סיסמת אזור הניהול (/admin) — חובה להגדיר בלוח הבקרה
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      # Haiku 5.5 — $0.10/$1M קלט, $0.50 פלט. היה Sonnet 4.6 ($3/$15), פי 30.
      # לשדרוג חזרה: claude-sonnet-5-5 ($2/$10, זול וחדש מ-4.6).
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      # מודל מהיר לשיחות קול (היה Haiku 4.5 — $1/$5, פי 10 מהנוכחי)
      - key: ANTHROPIC_VOICE_MODEL
        value: claude-haiku-5-5
      - key: SAFE_CHILD_MODE
        value: "true"
      # קול (אופציונלי): STT/TTS של Azure — בלי זה הצ'אט בכתב עובד רגיל
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      # ===== שמירת נתונים בחינם (חשבונות/התקדמות שורדים deploy והרדמה) =====
      # Upstash Redis (חינמי): כל כתיבה מסתנכרנת לענן, ובעליית השרת הכל משוחזר.
      # יוצרים DB בחינם ב-console.upstash.com ומדביקים כאן את ה-REST URL וה-TOKEN.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
