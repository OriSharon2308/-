<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מערכת לימוד – אזור הלמידה</title>
    <link rel="icon" href="/favicon-teacher.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      @font-face {
        font-family: "Dana Yad";
        src:
          url("/fonts/DanaYadAlefAlefAlef-Normal.woff") format("woff"),
          url("/fonts/DanaYadAlefAlefAlef-Normal.otf") format("opentype");
        font-weight: normal;
        font-display: swap;
      }

      /* ===== אזור הלמידה — אותה שפה עיצובית כמו דף הבית ===== */
      .learnBody {
        background:
          radial-gradient(760px 540px at 90% -8%, rgba(249, 168, 96, 0.18), transparent 60%),
          radial-gradient(720px 560px at 4% 4%, rgba(20, 184, 166, 0.18), transparent 58%),
          radial-gradient(680px 600px at 70% 120%, rgba(139, 124, 240, 0.13), transparent 60%),
          #eef6f4;
        min-height: 100vh;
      }
      .learn {
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px clamp(16px, 4vw, 40px) 60px;
      }

      .learn .brand__mark {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(140deg, #16c4b2, #0d9488);
        color: #fff;
        font-size: 22px;
        box-shadow: 0 8px 18px rgba(13, 148, 136, 0.3);
      }
      .learn .brand__title {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 20px;
        color: #0f3b36;
      }

      /* כותרת האזור */
      .learnHead {
        text-align: center;
        margin: 2px 0 18px;
      }
      .learnHead__eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.7);
        border: 2px solid rgba(13, 148, 136, 0.18);
        color: #0d9488;
        font-weight: 700;
        font-size: 14px;
        padding: 7px 16px;
        border-radius: 999px;
      }
      .learnHead__title {
        font-family: "Dana Yad", cursive;
        font-size: clamp(48px, 7.6vw, 86px);
        line-height: 1.08;
        font-weight: 700;
        color: #0f3b36;
        -webkit-text-stroke: 0.5px #0f3b36;
        margin: 0 0 8px;
      }
      .learnHead__subtitle {
        font-size: clamp(15px, 2.2vw, 19px);
        font-weight: 600;
        color: #46615f;
        margin: 0;
      }
      .learnHead__grade {
        color: #c2410c;
      }

      /* ===== קרוסלת הנושאים =====
         הנושא הפעיל גדול במרכז, והשכנים מציצים משני הצדדים.
         כל פריט ממוקם ממשתנה אחד: --d (המרחק מהמרכז), שנקבע ב-JS. */
      .carousel {
        position: relative;
        height: 540px;
        margin-top: -18px;
        touch-action: pan-y;
        user-select: none;
        overflow: hidden;
      }
      .topicGrid {
        position: absolute;
        inset: 0;
      }
      /* בלי מסגרת — האיור יושב ישר על רקע העמוד */
      .topicTile {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(430px, 80vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        border: none;
        border-radius: 24px;
        padding: 10px 8px 14px;
        background: none;
        box-shadow: none;
        cursor: pointer;
        font-family: inherit;
        transform: translate(-50%, -50%) translateX(var(--x, 0px)) scale(var(--s, 1));
        opacity: var(--o, 1);
        z-index: var(--z, 1);
        transition:
          transform 0.62s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.45s ease;
        will-change: transform;
      }
      /* בזמן גרירה — עוקב אחרי האצבע בלי השהיה */
      .carousel.is-dragging .topicTile {
        transition: none;
      }
      /* הצצה בצד: ריחוף מבליט אותה החוצה ומגדיל קצת */
      .topicTile--side {
        cursor: pointer;
      }
      .topicTile--side:hover,
      .topicTile--side:focus-visible {
        transform: translate(-50%, -50%) translateX(calc(var(--x, 0px) + var(--push, 0px)))
          scale(calc(var(--s, 1) * 1.09));
        opacity: 1;
      }
      /* בהצצות מציגים רק את האיור והשם — בלי צ'יפים וקריאה-לפעולה */
      .topicTile--side .topicTile__subs,
      .topicTile--side .topicTile__go {
        display: none;
      }
      .topicTile--side .topicTile__name {
        font-size: 16px;
        opacity: 0.75;
      }
      .topicTile--hidden {
        pointer-events: none;
      }
      .topicTile:focus-visible {
        outline: 3px solid #0d9488;
        outline-offset: 6px;
        border-radius: 28px;
      }

      /* חיצי ניווט */
      .cNav {
        position: absolute;
        top: 44%;
        z-index: 40;
        width: 46px;
        height: 46px;
        border-radius: 999px;
        border: 1.5px solid rgb(13 60 53 / 0.12);
        background: rgba(255, 255, 255, 0.82);
        color: #0d9488;
        font-size: 22px;
        line-height: 1;
        display: grid;
        place-items: center;
        cursor: pointer;
        backdrop-filter: blur(6px);
        box-shadow: 0 4px 14px rgb(13 60 53 / 0.1);
        transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
      }
      .cNav:hover {
        background: #fff;
        transform: scale(1.09);
      }
      .cNav:disabled {
        opacity: 0.25;
        cursor: default;
      }
      .cNav--prev { inset-inline-end: 4px; }
      .cNav--next { inset-inline-start: 4px; }

      /* נקודות מתחת */
      .cDots {
        position: absolute;
        bottom: 2px;
        inset-inline: 0;
        display: flex;
        justify-content: center;
        gap: 7px;
        z-index: 40;
      }
      .cDot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: none;
        padding: 0;
        background: rgb(13 60 53 / 0.16);
        cursor: pointer;
        transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s;
      }
      .cDot.is-on {
        width: 24px;
        background: #0d9488;
      }
      /* מקום האיור — ריבועי וקבוע, כך שכל האריחים באותו גובה
         (גם אלה שעדיין מציגים אימוג'י עד שיעלו להם תמונה) */
      .topicTile__icon {
        width: 100%;
        max-width: 340px;
        aspect-ratio: 1;
        margin-inline: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        font-size: 96px;
        background: none !important;
        box-shadow: none;
      }
      .topicTile__icon--art {
        position: relative;
      }
      .topicTile__img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      /* הנושא הפעיל "נושם" קלות בריחוף; בהצצות ההגדלה כבר בכרטיס עצמו */
      .topicTile--active:hover .topicTile__img {
        transform: scale(1.05) rotate(-1.5deg);
      }
      /* האימוג'י מוצג רק כשאין קובץ איור */
      .topicTile__icon--art.has-art .topicTile__emoji {
        display: none;
      }
      .topicTile__icon--art .topicTile__emoji {
        font-size: 40px;
      }
      .topicTile__name {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        font-size: 20px;
        color: #0f3b36;
        line-height: 1.2;
      }
      .topicTile__subs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin-top: 2px;
      }
      .topicTile__sub {
        font-size: 13px;
        font-weight: 600;
        color: #5a6b68;
        background: rgba(13, 60, 53, 0.05);
        padding: 4px 10px;
        border-radius: 999px;
      }
      /* קריאה-לפעולה עדינה — בלי מסגרת היא לא צריכה לצעוק */
      .topicTile__go {
        margin-top: 2px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #0d9488;
        font-weight: 700;
        font-size: 14px;
        opacity: 0.72;
        transition: opacity 0.18s ease;
      }
      .topicTile:hover .topicTile__go {
        opacity: 1;
      }
      .topicTile__go .arrow {
        transition: transform 0.18s ease;
      }
      .topicTile:hover .topicTile__go .arrow {
        transform: translateX(-5px);
      }

      /* גוונים מתחלפים לאריחים */
      /* גוני-רקע רק לאריחים שעדיין באימוג'י — האיורים נשארים על רקע נקי */
      .topicTile:nth-child(6n + 1) .topicTile__icon:not(.topicTile__icon--art) { background: #d6f4ef !important; }
      .topicTile:nth-child(6n + 2) .topicTile__icon:not(.topicTile__icon--art) { background: #ffe7df !important; }
      .topicTile:nth-child(6n + 3) .topicTile__icon:not(.topicTile__icon--art) { background: #fff0c9 !important; }
      .topicTile:nth-child(6n + 4) .topicTile__icon:not(.topicTile__icon--art) { background: #eae6ff !important; }
      .topicTile:nth-child(6n + 5) .topicTile__icon:not(.topicTile__icon--art) { background: #dbeafe !important; }
      .topicTile:nth-child(6n + 6) .topicTile__icon:not(.topicTile__icon--art) { background: #fde2f3 !important; }

      .learnEmpty {
        text-align: center;
        color: #5a6b68;
        font-weight: 600;
        padding: 40px 0;
      }

      /* טוסט "בקרוב" */
      .learnToast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%) translateY(20px);
        background: #0f3b36;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        padding: 13px 22px;
        border-radius: 999px;
        box-shadow: 0 14px 30px rgba(15, 59, 54, 0.34);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 50;
      }
      .learnToast.is-show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .topicTile,
        .topicTile__go .arrow,
        .learnToast {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="learnBody">
    <main class="learn">
      <header class="home__top">
        <span class="brand brand--hidden" aria-hidden="true"></span>
        <div class="home__topRight">
          <span id="userChip" class="userChip" hidden>
            <span class="userChip__icon" aria-hidden="true">👤</span>
            <span id="learnName" class="userChip__name"></span>
          </span>
          <div class="menuWrap">
            <button id="menuBtn" class="hamburger" type="button" aria-label="תפריט" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
            <div id="menu" class="menu">
              <a href="/" class="menu__item" style="text-decoration: none">🏠 דף הבית</a>
              <a href="/practice" class="menu__item" style="text-decoration: none">✏️ לתרגול</a>
              <a href="/progress" class="menu__item" style="text-decoration: none">📊 ההתקדמות שלי</a>
              <button id="logoutItem" class="menu__item menu__item--danger" type="button">התנתקות</button>
            </div>
          </div>
        </div>
      </header>

      <section class="learnHead">
        <h1 class="learnHead__title">מה בא לך ללמוד?</h1>
        <p class="learnHead__subtitle">
          בחרו נושא ונצא ללמוד אותו יחד
          <span class="learnHead__grade" id="gradeLabel" hidden></span>
        </p>
      </section>

      <section aria-label="נושאים ללמידה">
        <div class="carousel" id="carousel">
          <div class="topicGrid" id="topicGrid">
            <div class="learnEmpty" id="loadingMsg">טוען נושאים…</div>
          </div>
          <button class="cNav cNav--prev" id="cPrev" type="button" aria-label="הנושא הקודם" hidden>›</button>
          <button class="cNav cNav--next" id="cNext" type="button" aria-label="הנושא הבא" hidden>‹</button>
          <div class="cDots" id="cDots"></div>
        </div>
      </section>
    </main>

    <div class="learnToast" id="learnToast" role="status" aria-live="polite"></div>

    <script src="/topic-art.js?v=2"></script>
    <script>
      // אימוג'י לכל נושא לפי מילות מפתח בשם הנושא
      function topicIcon(key) {
        const k = String(key || "");
        const has = (s) => k.indexOf(s) !== -1;
        if (has("חיבור") && has("חיסור")) return "➕";
        if (has("חיבור")) return "➕";
        if (has("חיסור")) return "➖";
        if (has("כפל")) return "✖️";
        if (has("חילוק")) return "➗";
        if (has("שעון")) return "🕐";
        if (has("כסף") || has("מטבע")) return "🪙";
        if (has("צורות") || has("צלע") || has("קודקוד")) return "🔷";
        if (has("שבר")) return "🍕";
        if (has("אחוז")) return "％";
        if (has("עשרוני")) return "🔟";
        if (has("נעלם") || has("משוו")) return "❓";
        if (has("יחס") || has("פרופור")) return "⚖️";
        if (has("מילולי")) return "📖";
        if (has("מספר")) return "🔢";
        return "✨";
      }

      const toastEl = document.getElementById("learnToast");
      let toastTimer = null;
      function showToast(text) {
        toastEl.textContent = text;
        toastEl.classList.add("is-show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("is-show"), 2600);
      }

      function renderTopics(topics) {
        const grid = document.getElementById("topicGrid");
        grid.innerHTML = "";
        if (!topics || !topics.length) {
          grid.innerHTML = '<div class="learnEmpty">עדיין אין נושאים לכיתה הזו 🙂</div>';
          return;
        }
        for (const t of topics) {
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = "topicTile";
          tile.setAttribute("data-key", t.key);

          const icon = document.createElement("div");
          icon.className = "topicTile__icon";
          icon.setAttribute("aria-hidden", "true");
          // איור הנושא אם קיים (images/topics/) — אחרת אימוג'י
          const slug = window.velaTopicArt ? window.velaTopicArt.slugFor(t.key, null) : null;
          if (slug) {
            icon.classList.add("topicTile__icon--art");
            icon.innerHTML = window.velaTopicArt.imgHtml(slug, "topicTile__img", "has-art");
            icon.appendChild(document.createTextNode(""));
            const fallback = document.createElement("span");
            fallback.className = "topicTile__emoji";
            fallback.textContent = topicIcon(t.key);
            icon.appendChild(fallback);
          } else {
            icon.textContent = topicIcon(t.key);
          }
          tile.appendChild(icon);

          const name = document.createElement("div");
          name.className = "topicTile__name";
          name.textContent = t.key;
          tile.appendChild(name);

          if (Array.isArray(t.sub) && t.sub.length) {
            const subs = document.createElement("div");
            subs.className = "topicTile__subs";
            for (const s of t.sub) {
              const chip = document.createElement("span");
              chip.className = "topicTile__sub";
              chip.textContent = s.label || s.key;
              subs.appendChild(chip);
            }
            tile.appendChild(subs);
          }

          const go = document.createElement("div");
          go.className = "topicTile__go";
          go.innerHTML = '<span>בואו נלמד</span><span class="arrow" aria-hidden="true">←</span>';
          tile.appendChild(go);

          // לחיצה על הצצה בצד → מביאה אותה למרכז. לחיצה על המרכז → נכנסים לשיעור.
          tile.addEventListener("click", () => {
            const i = TILES.indexOf(tile);
            if (i !== active) { setActive(i); return; }
            if (dragMoved) return; // הייתה גרירה — לא נחשב כלחיצה
            window.location.href = "/learn-board?topic=" + encodeURIComponent(t.key);
          });

          grid.appendChild(tile);
          TILES.push(tile);
        }
        buildDots();
        active = Math.floor((TILES.length - 1) / 2); // מתחילים באמצע — הצצות משני הצדדים
        layout(true);
        wireCarousel();
      }

      /* ═══════════ קרוסלה ═══════════
         כל פריט ממוקם לפי המרחק שלו מהמרכז (d). ב-RTL "הבא" נע שמאלה,
         ולכן ההיסט הוא ‎-d‎ — הפריט הבא ברשימה מציץ מצד שמאל. */
      const TILES = [];
      let active = 0;
      let dragMoved = false;

      const carouselEl = () => document.getElementById("carousel");
      // מרחק בין שכנים — לעולם לא 0 (חילוק ב-0 היה מייצר NaN וכל הפריטים נערמו במרכז)
      const STEP = () => {
        const w = window.innerWidth || document.documentElement.clientWidth || 900;
        return Math.max(180, Math.min(355, w * 0.36));
      };
      const reduceMotion = () =>
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function layout(instant, dragPx) {
        const drag = Number(dragPx) || 0;
        const step = STEP() || 1;
        TILES.forEach((tile, i) => {
          const d = i - active - drag / step; // מרחק רציף (כולל גרירה)
          const ad = Math.abs(d);
          // מיקום: ‎-d‎ → הפריט הבא נע שמאלה (כיוון הקריאה בעברית)
          let x = -d * step;
          if (!Number.isFinite(x)) x = 0;
          const s = Math.max(0.55, 1 - ad * 0.3);
          // רק שכן אחד בכל צד — מה שרחוק יותר נעלם לגמרי
          const o = ad > 1.5 ? 0 : ad > 0.5 ? 0.85 : 1;
          const z = 30 - Math.round(ad * 10);
          tile.style.setProperty("--x", x.toFixed(1) + "px");
          tile.style.setProperty("--s", s.toFixed(3));
          tile.style.setProperty("--o", o.toFixed(2));
          tile.style.setProperty("--z", String(z));
          // ריחוף מבליט את ההצצה החוצה — ימינה לימניות, שמאלה לשמאליות
          tile.style.setProperty("--push", (d < 0 ? 18 : -18) + "px");

          const isActive = Math.round(d) === 0;
          tile.classList.toggle("topicTile--active", isActive);
          tile.classList.toggle("topicTile--side", !isActive);
          tile.classList.toggle("topicTile--hidden", ad > 1.5);
          tile.setAttribute("aria-hidden", ad > 1.5 ? "true" : "false");
          tile.tabIndex = isActive ? 0 : ad <= 1.2 ? 0 : -1;
        });
        updateDots();
        const prev = document.getElementById("cPrev");
        const next = document.getElementById("cNext");
        if (prev && next) {
          prev.hidden = next.hidden = TILES.length < 2;
          prev.disabled = active >= TILES.length - 1;
          next.disabled = active <= 0;
        }
        if (instant) {
          // ציור ראשון בלי אנימציה
          carouselEl()?.classList.add("is-dragging");
          void carouselEl()?.offsetWidth;
          requestAnimationFrame(() => carouselEl()?.classList.remove("is-dragging"));
        }
      }

      function setActive(i) {
        const n = TILES.length;
        if (!n) return;
        active = Math.max(0, Math.min(n - 1, i));
        layout();
        const t = TILES[active];
        if (t && document.activeElement && document.activeElement.closest(".carousel")) t.focus();
      }
      const move = (delta) => setActive(active + delta);

      function buildDots() {
        const dots = document.getElementById("cDots");
        if (!dots) return;
        dots.innerHTML = "";
        if (TILES.length < 2) return;
        TILES.forEach((_, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "cDot";
          b.setAttribute("aria-label", `נושא ${i + 1}`);
          b.addEventListener("click", () => setActive(i));
          dots.appendChild(b);
        });
      }
      function updateDots() {
        const dots = document.getElementById("cDots");
        if (!dots) return;
        [...dots.children].forEach((d, i) => d.classList.toggle("is-on", i === active));
      }

      function wireCarousel() {
        const el = carouselEl();
        if (!el || el.dataset.wired) return;
        el.dataset.wired = "1";

        // הכפתור הימני מקדם קדימה והשמאלי אחורה (הוחלף לפי בקשה)
        document.getElementById("cPrev")?.addEventListener("click", () => move(1));
        document.getElementById("cNext")?.addEventListener("click", () => move(-1));

        // מקלדת: ← → (ב-RTL החץ שמאלה מקדם קדימה)
        el.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") { e.preventDefault(); move(1); }
          else if (e.key === "ArrowRight") { e.preventDefault(); move(-1); }
          else if (e.key === "Home") { e.preventDefault(); setActive(0); }
          else if (e.key === "End") { e.preventDefault(); setActive(TILES.length - 1); }
        });

        // גלגלת/טראקפד — עם חסם כדי שגלילה אחת לא תדלג על חמישה נושאים
        let wheelLock = 0;
        el.addEventListener(
          "wheel",
          (e) => {
            const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
            if (!dx) return; // גלילה אנכית — משאירים לעמוד
            e.preventDefault();
            const now = Date.now();
            if (now < wheelLock || Math.abs(dx) < 12) return;
            wheelLock = now + 380;
            move(dx > 0 ? -1 : 1);
          },
          { passive: false }
        );

        // גרירה/החלקה — עוקבת אחרי האצבע ומתייצבת לקרוב ביותר
        let startX = null;
        let dx = 0;
        const down = (x) => { startX = x; dx = 0; dragMoved = false; el.classList.add("is-dragging"); };
        const moveTo = (x) => {
          if (startX === null) return;
          dx = x - startX;
          if (Math.abs(dx) > 6) dragMoved = true;
          layout(false, -dx);
        };
        const up = () => {
          if (startX === null) return;
          el.classList.remove("is-dragging");
          const step = STEP();
          const jumped = Math.round(-dx / step);
          startX = null;
          if (jumped) setActive(active + jumped);
          else layout();
          setTimeout(() => (dragMoved = false), 30);
        };
        el.addEventListener("pointerdown", (e) => { if (e.button === 0) down(e.clientX); });
        window.addEventListener("pointermove", (e) => moveTo(e.clientX));
        window.addEventListener("pointerup", up);
        window.addEventListener("pointercancel", up);

        window.addEventListener("resize", () => layout(true));
      }

      (async function init() {
        try {
          const meRes = await fetch("/api/me");
          const me = meRes.ok ? await meRes.json() : null;
          if (!me || !me.ok) {
            window.location.href = "/auth";
            return;
          }
          document.getElementById("learnName").textContent = me.user.username || "";
          document.getElementById("userChip").hidden = false;

          const topRes = await fetch("/api/topics");
          const data = topRes.ok ? await topRes.json() : null;
          const loading = document.getElementById("loadingMsg");
          if (loading) loading.remove();
          if (data && data.ok) {
            document.getElementById("gradeLabel").textContent = data.grade || "—";
            renderTopics(data.topics || []);
          } else {
            renderTopics([]);
          }
        } catch {
          window.location.href = "/auth";
        }
      })();

      // תפריט (זהה לדף הבית)
      const menuBtn = document.getElementById("menuBtn");
      const menu = document.getElementById("menu");
      function setMenu(open) {
        menu.classList.toggle("menu--open", open);
        menuBtn.classList.toggle("hamburger--open", open);
        menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
      }
      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setMenu(!menu.classList.contains("menu--open"));
      });
      document.addEventListener("click", (e) => {
        if (menu.classList.contains("menu--open") && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
          setMenu(false);
        }
      });
      document.getElementById("logoutItem").addEventListener("click", async () => {
        try {
          await fetch("/api/logout", { method: "POST" });
        } catch {
          /* ignore */
        }
        window.location.href = "/auth";
      });
    </script>
  </body>
</html>
