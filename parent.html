<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vela · אזור הורים</title>
    <link rel="icon" href="/teacher-character/faces/friendly.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/parent.css?v=17" />
  </head>
  <body>
    <div id="bootView" class="boot"><span class="spin" aria-label="טוען"></span></div>

    <!-- כניסה — עם פרטי החשבון של הילד -->
    <div id="loginView" class="login" hidden>
      <form id="loginForm" class="login__card" autocomplete="on">
        <img class="login__face" src="/teacher-character/faces/friendly.png" alt="" />
        <div class="login__brand">vela</div>
        <h1 class="login__title">אזור הורים</h1>
        <p class="login__sub">נכנסים עם שם המשתמש והסיסמה של הילד</p>

        <label class="login__label" for="pUser">שם משתמש</label>
        <input id="pUser" type="text" class="login__input" autocomplete="username" />

        <label class="login__label" for="pPw">סיסמה</label>
        <input id="pPw" type="password" class="login__input" autocomplete="current-password" />

        <button type="submit" class="login__btn">כניסה</button>
        <p id="loginErr" class="login__err" role="alert" hidden></p>
        <a class="login__back" href="/auth">חזרה למסך הכניסה של התלמידים</a>
      </form>
    </div>

    <!-- הדף -->
    <div id="app" class="app" hidden>
      <header class="bar">
        <div class="bar__id">
          <img class="bar__face" src="/teacher-character/faces/friendly.png" alt="vela" />
          <span class="bar__word">vela</span>
          <span class="bar__tag">אזור הורים</span>
        </div>
        <button id="logoutBtn" class="bar__out" type="button">יציאה</button>
      </header>

      <main id="main" class="page" aria-live="polite"></main>

      <footer class="foot">
        <span id="footNote"></span>
      </footer>
    </div>

    <script src="/parent.js?v=18"></script>
  </body>
</html>
